services:
  db:
    image: pgvector/pgvector:pg16
    container_name: clinsight-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clinsight
    volumes:
      - clinsight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinsight"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  clinsight_pgdata:
    name: clinsight_pgdata
